<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ផ្ទៀងផ្ទាត់គណនី</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "Khmer OS", -apple-system, sans-serif; }
    body { background-color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
    .container { text-align: center; width: 100%; max-width: 380px; }
    h2 { color: #000; font-size: 20px; margin-bottom: 10px; font-weight: bold; }
    p { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1.5px solid #dddfe2; border-radius: 10px; font-size: 16px; outline: none; text-align: center;}
    input:focus { border-color: #0088cc; }
    button { width: 100%; padding: 14px; background-color: #0088cc; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #a0cde6; }
    #status { margin-top: 15px; font-size: 14px; font-weight: bold; }
    #step2 { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔒 ផ្ទៀងផ្ទាត់សុវត្ថិភាព</h2>
    <div id="step1">
      <p>សូមបញ្ចូល Gmail របស់អ្នក។ ប្រព័ន្ធនឹងផ្ញើលេខកូដ 6 ខ្ទង់ ទៅកាន់ Inbox របស់អ្នក។</p>
      <input type="email" id="email" placeholder="បញ្ចូល Gmail របស់អ្នក">
      <button id="btn1" onclick="sendOtp()">ផ្ញើលេខកូដ (OTP)</button>
    </div>
    <div id="step2">
      <p style="color: #2e7d32;">លេខកូដត្រូវបានផ្ញើទៅ Gmail ហើយ! សូមយកលេខ 6 ខ្ទង់មកបញ្ចូលទីនេះ។</p>
      <input type="number" id="otp" placeholder="បញ្ចូលលេខកូដ 6 ខ្ទង់">
      <button id="btn2" onclick="verifyOtp()">ផ្ទៀងផ្ទាត់កូដ</button>
    </div>
    <div id="status"></div>
  </div>

  <script>
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('chatId');

    // 🚨 ត្រូវប្រាកដថានេះជា URL របស់ Google Apps Script របស់អ្នក
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzyX6dyHeH9jwAxmaGFv5edhUxDLlAGCIV2zpJvpslc1ubQdQOxncvpy8Ykp6viXEA7/exec";
    var userEmail = "";

    function sendOtp() {
      var email = document.getElementById('email').value.trim();
      if(!email) return alert('សូមបញ្ចូល Gmail សិន');
      
      document.getElementById('status').innerText = 'កំពុងផ្ញើកូដទៅ Gmail...';
      document.getElementById('btn1').disabled = true;

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ action: 'requestOtp', email: email })
      }).then(res => res.text()).then(res => {
         if (res === "SUCCESS") {
           userEmail = email;
           document.getElementById('step1').style.display = 'none';
           document.getElementById('step2').style.display = 'block';
           document.getElementById('status').innerText = '';
         } else {
           document.getElementById('status').innerText = res;
           document.getElementById('status').style.color = '#d32f2f';
           document.getElementById('btn1').disabled = false;
         }
      }).catch(e => {
         document.getElementById('status').innerText = 'មានបញ្ហាក្នុងការភ្ជាប់។';
         document.getElementById('btn1').disabled = false;
      });
    }

    function verifyOtp() {
      var otp = document.getElementById('otp').value.trim();
      if(!otp) return;
      
      document.getElementById('status').innerText = 'កំពុងផ្ទៀងផ្ទាត់កូដ...';
      document.getElementById('btn2').disabled = true;

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ action: 'verifyOtp', email: userEmail, otp: otp, chatId: chatId })
      }).then(res => res.text()).then(res => {
         document.getElementById('status').innerText = res;
         if (res.indexOf("ជោគជ័យ") > -1) {
            document.getElementById('status').style.color = '#2e7d32';
            setTimeout(() => window.Telegram.WebApp.close(), 2000);
         } else {
            document.getElementById('status').style.color = '#d32f2f';
            document.getElementById('btn2').disabled = false;
         }
      });
    }
  </script>
</body>
</html>
